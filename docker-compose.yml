# Local development stack: PostgreSQL 16 + Redis 7. Run the API/worker/web with npm (see README).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/src/db/bootstrap.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/02-db.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
